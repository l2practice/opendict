# OpenDict data sources.
# Only these sources are used. Each is downloaded with a recorded checksum
# (pipeline/sources.sha256) so the data can be rebuilt exactly.

[[source]]
name = "English Wiktionary, English entries (Wiktextract, kaikki.org)"
file = "raw/raw-en.jsonl.gz"
url = "https://kaikki.org/dictionary/raw-wiktextract-data.jsonl.gz"
licence = "CC BY-SA 4.0; GFDL"
attribution = "Wiktionary contributors; Tatu Ylonen, Wiktextract (LREC 2022)"
retrieved = "2026-10-06"
used_for = "English headwords, IPA (UK/US), English glosses, examples, synonyms/antonyms, Vietnamese translations, inflected forms"

[[source]]
name = "English Wiktionary, English entries, postprocessed (Wiktextract, kaikki.org)"
file = "raw/kaikki-en.jsonl.gz"
url = "https://kaikki.org/dictionary/English/kaikki.org-dictionary-English.jsonl.gz"
licence = "CC BY-SA 4.0; GFDL"
attribution = "Wiktionary contributors; Tatu Ylonen, Wiktextract (LREC 2022)"
retrieved = "2026-10-06"
used_for = "fallback/dev only: quick English sample builds (translations sparse in postprocessed data); specialist domain labels (Kinh tế/Kế toán) via sense topics in extract_domains.py"

[[source]]
name = "Vietnamese Wiktionary (Wiktextract, kaikki.org)"
file = "raw/kaikki-vi.jsonl.gz"
url = "https://kaikki.org/dictionary/Vietnamese/kaikki.org-dictionary-Vietnamese.jsonl.gz"
licence = "CC BY-SA 4.0; GFDL"
attribution = "Những người đóng góp Wiktionary tiếng Việt; Wiktextract"
retrieved = "2026-10-06"
used_for = "Vietnamese headwords, English glosses, IPA (Hanoi/Hue/Saigon), examples, related/derived words; specialist domain labels (Kinh tế/Kế toán) via sense topics in extract_domains.py"

[[source]]
